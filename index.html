<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#f6f2ff"><title>小步星球 · ADHD友好AI陪伴教练</title><style>
:root{--bg:#f8f7fc;--panel:#fff;--ink:#27243c;--muted:#817d96;--lav:#755ed1;--lav2:#ece7ff;--mint:#dff8ee;--pink:#fff0ef;--line:#e9e6f1;--shadow:0 12px 42px rgba(67,49,105,.09)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#eee7ff,transparent 36%),radial-gradient(circle at 100% 70%,#eaf8f4,transparent 39%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #ada0ee;outline-offset:2px}.app{max-width:1120px;margin:auto;display:grid;grid-template-columns:265px minmax(0,1fr);min-height:100vh;gap:26px;padding:24px}.sidebar,.surface{background:rgba(255,255,255,.93);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:25px}.sidebar{padding:22px;height:calc(100vh - 48px);position:sticky;top:24px}.brand{font-size:24px;font-weight:900;letter-spacing:-.5px}.brand i{font-style:normal;color:var(--lav)}.mini{color:var(--muted);font-size:12px;margin-top:5px;line-height:1.6}.nav{display:grid;gap:9px;margin-top:35px}.nav button{border:0;background:transparent;text-align:left;padding:14px 16px;border-radius:14px;color:#5a536e;font-weight:700}.nav button.active{color:var(--lav);background:var(--lav2)}.side-tip{background:#f4f0ff;border-radius:18px;padding:17px;margin-top:32px;font-size:13px;line-height:1.8}.main{min-width:0}.top{display:flex;align-items:center;justify-content:space-between;margin:5px 0 20px;gap:12px}.eyebrow{font-size:12px;letter-spacing:1px;color:var(--lav);font-weight:800}.title{font-size:29px;margin:4px 0;font-weight:850}.stars{white-space:nowrap;background:#fff;padding:10px 14px;border-radius:30px;box-shadow:var(--shadow);font-weight:750}.surface{padding:24px;margin-bottom:18px}.hero{background:linear-gradient(115deg,#e9e3ff,#f5eeff 55%,#e9faf2);display:grid;grid-template-columns:1fr 155px;align-items:center;min-height:212px;overflow:hidden}.hero h2{font-size:25px;margin:6px 0 10px}.hero p{line-height:1.75;font-size:14px;color:#625b7d;margin:0 0 15px}.mascot{font-size:85px;text-align:center;filter:drop-shadow(0 9px 8px #baaedc66);animation:bob 3s ease-in-out infinite;user-select:none}@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}.pill{font-size:11px;background:white;border:1px solid #e0d8ff;border-radius:22px;padding:5px 10px;font-weight:700;color:var(--lav)}.hrow{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.section-title{font-size:18px;margin:0;font-weight:800}.subtle{color:var(--muted);font-size:13px;line-height:1.6}.primary{background:var(--lav);border:1px solid var(--lav);color:white;border-radius:12px;padding:11px 16px;font-weight:750}.secondary{background:white;border:1px solid #dcd4f9;color:var(--lav);border-radius:12px;padding:11px 16px;font-weight:700}.soft{background:var(--lav2);border:0;color:#5c43b8;border-radius:12px;padding:11px 16px;font-weight:700}.danger{color:#ac3c51;border:1px solid #f1cad4;background:white;padding:11px 14px;border-radius:12px}.small{font-size:12px;padding:8px 11px}.task{border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:11px;display:flex;gap:14px;align-items:center}.task.done{background:#f7fcfa}.check{width:35px;height:35px;border-radius:12px;background:#efeaff;color:var(--lav);border:0;font-size:19px;flex-shrink:0}.done .check{background:var(--mint);color:#1f8c6b}.task-body{flex:1;min-width:0}.task-name{font-size:15px;font-weight:800}.task-info{font-size:12px;color:var(--muted);margin-top:5px}.task-actions{display:flex;gap:5px;flex-wrap:wrap}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chatbox{height:360px;overflow-y:auto;background:#fbfaff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column;gap:11px}.bubble{max-width:87%;border-radius:15px;padding:12px 14px;font-size:14px;line-height:1.7;white-space:pre-wrap}.bubble.ai{align-self:flex-start;background:#eee9ff}.bubble.you{align-self:flex-end;background:#e2f7ee}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0}.field{width:100%;border:1px solid #ddd8e9;border-radius:12px;padding:12px;background:white;color:var(--ink)}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.stat{background:#f6f3ff;border-radius:15px;padding:17px}.stat b{font-size:25px}.progress{height:10px;border-radius:12px;background:#ebe7f5;overflow:hidden;margin-top:12px}.progress>div{height:100%;background:#8c7bdb;transition:width .3s}.controls{display:flex;gap:10px;flex-wrap:wrap}.timer{text-align:center;font-size:51px;letter-spacing:2px;font-weight:850;color:var(--lav);padding:10px}.panel-heading{margin:0 0 15px;font-size:18px}.setting{margin:15px 0}.setting label{display:block;font-weight:700;font-size:14px;margin:0 0 7px}.setting input[type=checkbox]{accent-color:var(--lav)}.growlist{display:grid;gap:9px;margin-top:12px}.growitem{background:#faf9ff;border:1px solid var(--line);padding:12px;border-radius:13px;font-size:14px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#33284c;color:white;padding:12px 19px;border-radius:18px;box-shadow:var(--shadow);z-index:10;max-width:90%;text-align:center;display:none}.confetti{position:fixed;pointer-events:none;z-index:10;font-size:35px;left:50%;top:24%;animation:pop 1.4s both}@keyframes pop{0%{transform:scale(.3);opacity:0}40%{opacity:1;transform:scale(1.4)}100%{transform:translateY(-70px) scale(1);opacity:0}}.muteblock{padding:14px;background:#faf8ff;border-radius:15px;line-height:1.7;font-size:13px}.notice{border-left:3px solid #ad9bfa;padding:9px 13px;font-size:12px;color:var(--muted);background:#f9f6ff;border-radius:5px;margin-top:17px}.hidden{display:none!important}@media(max-width:720px){.app{display:block;padding:12px 12px 84px}.sidebar{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;padding:7px 5px;border-radius:20px 20px 0 0;z-index:9;box-shadow:0 -5px 24px #695d881c}.brand,.sidebar .mini,.side-tip{display:none}.nav{display:flex;gap:2px;margin:0;justify-content:space-around}.nav button{font-size:11px;text-align:center;padding:12px 5px;flex:1}.main{padding:0}.title{font-size:23px}.surface{padding:17px;margin-bottom:13px;border-radius:20px}.hero{grid-template-columns:1fr 88px;min-height:175px}.hero h2{font-size:20px}.hero p{font-size:12px}.mascot{font-size:61px}.cols{grid-template-columns:1fr;gap:0}.task{align-items:flex-start}.task-actions{flex-direction:column}.chatbox{height:310px}.top{margin:9px 0 14px}}
</style></head><body><div class="app"><aside class="sidebar"><div class="brand">🪐 小步<i>星球</i></div><div class="mini">温柔坚定的执行功能陪伴教练<br>每一次重新开始，都算数。</div><nav class="nav" id="nav"><button data-page="home" class="active">🏡 今天</button><button data-page="coach">💬 小星教练</button><button data-page="plan">📋 我的计划</button><button data-page="growth">🌱 成长</button><button data-page="settings">⚙️ 设置</button></nav><div class="side-tip">✨ <b>我们的约定</b><br>小星不责备，不惩罚断签，也不会假装知道你没有告诉它的事情。</div></aside><main class="main"><header class="top"><div><div class="eyebrow" id="todaylabel"></div><h1 class="title" id="pagetitle">今天，从一小步开始</h1></div><div class="stars">⭐ <span id="starcount">0</span></div></header><section id="view"></section></main></div><div class="toast" id="toast" role="status"></div><script>
(()=>{'use strict';const KEY='little-steps-planet-v01',today=()=>new Date().toLocaleDateString('en-CA'),clock=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}),dateLabel=()=>new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),newId=()=>Math.random().toString(36).slice(2,10);const defaults=()=>({name:'冒险家',stars:20,lastDate:today(),tasks:[{id:newId(),title:'离开床铺并洗漱',when:'09:00',minutes:5,done:false},{id:newId(),title:'专注工作15分钟',when:'14:00',minutes:15,done:false},{id:newId(),title:'整理房间5分钟',when:'19:30',minutes:5,done:false},{id:newId(),title:'睡前回顾今天',when:'22:30',minutes:5,done:false}],events:[],chat:[{role:'ai',text:'你好，我是小星。今天不用一次做好所有事情。我们先找一个最容易开始的行动，好吗？'}],settings:{style:'active',follow:15,max:2,quiet:true,quietStart:'23:00',quietEnd:'08:00',remind:true},lastReminder:{},focusSeconds:300});let state;try{state=JSON.parse(localStorage.getItem(KEY))||defaults()}catch{state=defaults()}if(!Array.isArray(state.events)||!Array.isArray(state.tasks)||!Array.isArray(state.chat)||!state.settings)state=defaults();let page='home',focusRunning=false,interval=null,followTimer=null;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){showToast('存储失败，请尝试导出记录')}}function log(type,detail={},taskId=null){state.events.push({id:newId(),at:new Date().toISOString(),date:today(),type,taskId,...detail});save()}function rollover(){if(state.lastDate!==today()){state.tasks.forEach(t=>t.done=false);state.lastDate=today();save()}}rollover();function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.style.display='none',3000)}function celebrate(){const x=document.createElement('div');x.className='confetti';x.textContent='🎉 ✨ ⭐';document.body.appendChild(x);setTimeout(()=>x.remove(),1400)}function addAi(msg){state.chat.push({role:'ai',text:msg});save()}function addYou(msg){state.chat.push({role:'you',text:msg});save()}function changePage(next){page=next;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();scrollTo({top:0,behavior:'smooth'})}function firstPending(){return state.tasks.find(t=>!t.done)}function render(){rollover();document.getElementById('starcount').textContent=state.stars;document.getElementById('todaylabel').textContent=dateLabel();document.getElementById('pagetitle').textContent={home:'今天，从一小步开始',coach:'和小星聊聊',plan:'让计划变得可执行',growth:'每一小步都有意义',settings:'你的节奏，你决定'}[page];document.getElementById('view').innerHTML=({home:homeView,coach:coachView,plan:planView,growth:growthView,settings:settingsView}[page])()}function bar(){let count=state.tasks.filter(t=>t.done).length;return `<div class="progress"><div style="width:${state.tasks.length?count/state.tasks.length*100:0}%"></div></div><div class="subtle" style="margin-top:8px">今日 ${count} / ${state.tasks.length} 项 · 做到一点就值得肯定</div>`}function homeView(){let pending=firstPending();return `<div class="surface hero"><div><span class="pill">AI行动搭子 · 演示版</span><h2>你好，${esc(state.name)}！</h2><p>${pending?'今天也不用追求完美。我们先做眼前的一小步。':'今天的计划都完成啦！你可以轻松休息，也可以自由安排。'}</p><button class="primary" data-act="go-coach">${pending?'我需要小星帮我启动 →':'和小星聊聊 →'}</button></div><div class="mascot" aria-label="可爱的小星">🤖</div></div><div class="surface"><div class="hrow"><h3 class="section-title">🎯 眼前这一件</h3><span class="pill">只关注下一步</span></div>${pending?`<h2 style="margin:20px 0 6px">${esc(pending.title)}</h2><p class="subtle">计划时间 ${esc(pending.when)} · 预估 ${pending.minutes} 分钟</p><div class="controls"><button class="primary" data-act="start" data-id="${pending.id}">▶ 先开始</button><button class="secondary" data-act="complete" data-id="${pending.id}">✓ 已经完成</button><button class="soft" data-act="stuck" data-id="${pending.id}">我卡住了</button></div>`:'<p class="subtle">完成全部任务不是唯一目标，你也可以在计划页面为自己安排合理的休息。</p>'}${bar()}</div><div class="cols"><div class="surface"><h3 class="section-title">🧭 快速回到正轨</h3><p class="subtle">刚才走神、刷手机，或者不知道做什么了？</p><button class="secondary" data-act="recover">一键偏航拉回</button></div><div class="surface"><h3 class="section-title">⏱ 5分钟启动</h3><p class="subtle">不用先有动力，试着做五分钟。</p><button class="secondary" data-act="focus">进入微专注模式</button></div></div><div class="notice">隐私与能力说明：当前页面可离线运行。对话采用预设规则模拟AI教练，未连接大模型；提醒只在本页面打开时检测，不能替代真实App后台推送。</div>`}function coachView(){return `<div class="surface"><div class="hrow"><div><h3 class="section-title">🤖 小星 · 你的行动教练</h3><p class="subtle">可以说出困难，也可以只点击一个选项</p></div><span class="pill">规则演示 · 非实时AI</span></div><div class="chatbox" id="chatbox" aria-live="polite">${state.chat.slice(-24).map(m=>`<div class="bubble ${m.role==='you'?'you':'ai'}">${esc(m.text)}</div>`).join('')}</div><div class="chips">${[['start','帮我开始'],['hard','任务太难'],['distract','刚走神了'],['tired','有点累'],['next','下一步做什么'],['done','我完成了']].map(([k,v])=>`<button class="soft small" data-act="coach-quick" data-kind="${k}">${v}</button>`).join('')}</div><form class="composer" id="chat-form"><input class="field" id="chat-input" autocomplete="off" placeholder="用一句话描述你的情况…" maxlength="500" aria-label="输入给小星的消息"><button class="primary" type="submit">发送</button></form><div class="notice">对话为可交互的规则模板演示，不提供临床诊断，也不声称理解未提供的情绪或行为。</div></div>`}function planView(){return `<div class="surface"><h3 class="section-title">📋 今日计划</h3><p class="subtle">推荐先安排3—5项，全部可以删除、调整、跳过。</p>${state.tasks.length?state.tasks.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-act="complete" data-id="${t.id}" aria-label="${t.done?'取消完成':'完成任务'}">${t.done?'✓':'○'}</button><div class="task-body"><div class="task-name">${esc(t.title)}</div><div class="task-info">${esc(t.when)} · ${t.minutes}分钟 · ${t.done?'已完成':'待行动'}</div></div><div class="task-actions"><button class="secondary small" data-act="stuck" data-id="${t.id}">帮我启动</button><button class="secondary small" data-act="remove" data-id="${t.id}">删除</button></div></div>`).join(''):'<p class="subtle">还没有任务，先添加一件小事吧。</p>'}</div><div class="surface"><h3 class="section-title">＋ 添加一个可执行任务</h3><form id="addtask"><div class="setting"><label for="taskname">要完成的行动</label><input class="field" id="taskname" maxlength="60" required placeholder="例：打开论文并阅读摘要"></div><div class="cols"><div class="setting"><label for="tasktime">计划时间</label><input class="field" id="tasktime" type="time" value="14:00" required></div><div class="setting"><label for="taskmins">预计分钟</label><select class="field" id="taskmins"><option>2</option><option>5</option><option selected>15</option><option>25</option><option>45</option></select></div></div><button class="primary" type="submit">添加任务</button></form></div>`}function growthView(){let ev=state.events.filter(e=>e.date===today()),count=ev.filter(e=>e.type==='completed').length,restarts=ev.filter(e=>e.type==='recovered'||e.type==='started').length,level=Math.floor(state.stars/100)+1;return `<div class="surface hero"><div><span class="pill">成长旅程</span><h2>Lv.${level} · 小步探险家</h2><p>你的价值不由打卡次数决定。每一次愿意重新开始，都是一次进步。</p><div class="stars" style="display:inline-block">⭐ ${state.stars} 星星</div></div><div class="mascot">🌱</div></div><div class="cols"><div class="surface stat"><div class="subtle">今天的完成次数</div><b>${count}</b></div><div class="surface stat"><div class="subtle">今天的启动 / 恢复尝试</div><b>${restarts}</b></div></div><div class="surface"><h3 class="section-title">📈 最近7天的行动轨迹</h3><div class="growlist">${Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const day=d.toLocaleDateString('en-CA');const e=state.events.filter(x=>x.date===day);return `<div class="growitem"><b>${day}</b>　完成 ${e.filter(x=>x.type==='completed').length} 项 · 启动 ${e.filter(x=>x.type==='started').length} 次 · 恢复 ${e.filter(x=>x.type==='recovered').length} 次</div>`}).join('')}</div><button class="soft" data-act="review" style="margin-top:15px">让小星做一次简单复盘</button></div>`}function settingsView(){let s=state.settings;return `<div class="surface"><h3 class="section-title">👤 我的教练</h3><div class="setting"><label for="nickname">昵称</label><input class="field" id="nickname" maxlength="24" value="${esc(state.name)}"></div><div class="setting"><label for="style">希望小星怎样提醒我</label><select class="field" id="style"><option value="gentle" ${s.style==='gentle'?'selected':''}>温柔鼓励</option><option value="active" ${s.style==='active'?'selected':''}>主动监督 · 清晰具体</option><option value="brief" ${s.style==='brief'?'selected':''}>简短指令 · 少聊天</option></select></div><div class="setting"><label for="follow">未确认后跟进间隔</label><select class="field" id="follow">${[5,10,15,20,30].map(v=>`<option value="${v}" ${s.follow===v?'selected':''}>${v}分钟</option>`).join('')}</select></div><div class="setting"><label for="maxfollow">每项任务最多追加提醒</label><select class="field" id="maxfollow">${[0,1,2,3].map(v=>`<option value="${v}" ${s.max===v?'selected':''}>${v}次</option>`).join('')}</select></div><div class="setting"><label><input type="checkbox" id="remind" ${s.remind?'checked':''}> 本页面打开时检测到点提醒</label></div><div class="setting"><label><input type="checkbox" id="quiet" ${s.quiet?'checked':''}> 睡眠免打扰</label></div><div class="cols"><div class="setting"><label for="quietStart">免打扰开始</label><input type="time" class="field" id="quietStart" value="${esc(s.quietStart)}"></div><div class="setting"><label for="quietEnd">免打扰结束</label><input type="time" class="field" id="quietEnd" value="${esc(s.quietEnd)}"></div></div><div class="controls"><button class="primary" data-act="save-settings">保存设置</button><button class="secondary" data-act="notification">请求浏览器通知授权</button></div><p class="subtle">浏览器通知仅在获得权限且页面打开时尝试触发。关闭浏览器后不提供可靠的系统级提醒，真实主动监督需要App通知或服务器推送。</p></div><div class="surface"><h3 class="section-title">🔒 数据与隐私</h3><p class="subtle">原型数据保存在当前浏览器的 localStorage，不上传服务器；清理浏览器数据可能导致记录丢失。请勿输入敏感健康信息。</p><div class="controls"><button class="secondary" data-act="export">导出JSON记录</button><button class="danger" data-act="reset">清除本地数据</button></div></div>`}function complete(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(t.done){t.done=false;state.stars=Math.max(0,state.stars-15);log('unchecked',{},id);showToast('已取消完成');render();return}t.done=true;state.stars+=15;log('completed',{title:t.title},id);addAi(`🎉 ${t.title}完成啦！获得15颗星星。${firstPending()?`接下来是“${firstPending().title}”。要不要先做一个最小动作？`:'今天已安排的任务都完成了，可以安心休息。'}`);celebrate();showToast('完成啦！+15 ⭐');render()}function coaching(kind,silent=false){const current=firstPending(),task=current?`“${current.title}”`:'今天没有待办任务';let msg={start:`我们先不考虑做完所有事。现在的目标是${task}。第一步：只为它准备好工具或打开相关页面。完成这一步再决定要不要继续。`,hard:`听起来这件事现在有点难。我们把${task}缩到2分钟：只做最容易的准备动作。你愿意试试吗？`,distract:'欢迎回来。现在不用分析刚才浪费了多久。把干扰源暂时移开，看看原任务停在哪里，然后做30秒就好。',tired:'听起来你可能需要休息。先喝点水，确认是否需要真正休息。精力不足时可以缩小任务或推迟，不必硬撑。',next:current?`下一项是${task}。先准备好所需材料，做2分钟即可。`:'今天的计划已结束，可以选择休息或规划明天。',done:'你完成了一步！值得肯定的是你采取了行动。现在可以选择继续、短暂休息或结束。',recover:'我们来做一次温和的偏航拉回：①把注意力放回当前环境；②找到刚才的任务；③选一个30秒动作。中断不是失败。',review:'先看看你最近7天完成、启动与恢复的记录。少量数据无法判断原因，我们会把可能的困难当成待验证的假设。'}[kind]||'我听到了。我们先尝试把目标变成一件2分钟内能做的事。';if(!silent)addYou(({start:'帮我开始',hard:'任务太难',distract:'刚刚走神了',tired:'有点累',next:'下一步做什么',done:'我完成了',recover:'我偏航了，帮我回来',review:'帮我复盘'}[kind]||kind));addAi(msg);if(kind==='recover'){state.stars+=3;log('recovered',{source:'self_report'});showToast('愿意重新开始也值得奖励：+3 ⭐')}if(kind==='start')log('started',{source:'coaching'},current?.id);save();changePage('coach');const c=document.getElementById('chatbox');if(c)c.scrollTop=c.scrollHeight}function replyFree(s){addYou(s);const text=s.toLowerCase();let k=/困难|太难|不会|不知道/.test(text)?'hard':/累|困|疲惫|休息/.test(text)?'tired':/手机|刷|走神|分心|偏航/.test(text)?'distract':/完成|做完|好了/.test(text)?'done':/开始|启动|拖延/.test(text)?'start':'next';coaching(k,true)}function inQuiet(){if(!state.settings.quiet)return false;let a=state.settings.quietStart,b=state.settings.quietEnd,t=clock();return a<=b?t>=a&&t<b:t>=a||t<b}function notifyTask(t,follow=false){const message=`${follow?'小星来轻轻确认一下':'到计划时间啦'}：${t.title}。现在可以选择开始、推迟或跳过。`;showToast(message);if(Notification.permission==='granted')try{new Notification('小步星球 · 小星',{body:message})}catch{};addAi(message);save()}function checkReminders(){if(!state.settings.remind||inQuiet())return;const now=clock(),nowMinute=Number(now.slice(0,2))*60+Number(now.slice(3,5));for(const t of state.tasks){if(t.done)continue;const minute=Number(t.when.slice(0,2))*60+Number(t.when.slice(3,5));let key=t.id+'-'+today();let entry=state.lastReminder[key];if(nowMinute>=minute&&nowMinute<minute+2&&!entry){notifyTask(t);state.lastReminder[key]={at:Date.now(),count:0};save()}else if(entry&&entry.count<state.settings.max&&Date.now()-entry.at>=state.settings.follow*60000){notifyTask(t,true);entry.at=Date.now();entry.count++;save()}}}function setFocus(){if(!focusRunning){focusRunning=true;state.focusSeconds=state.focusSeconds>0?state.focusSeconds:300;log('started',{mode:'focus'});interval=setInterval(()=>{state.focusSeconds--;const t=document.getElementById('focus-display');if(t)t.textContent=formatSeconds(state.focusSeconds);if(state.focusSeconds<=0){clearInterval(interval);interval=null;focusRunning=false;state.focusSeconds=300;state.stars+=5;log('focus_finished');celebrate();showToast('5分钟微专注完成！+5 ⭐');render()}},1000)}}function formatSeconds(n){return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}function showFocus(){document.getElementById('view').innerHTML=`<div class="surface" style="text-align:center"><h3>⏱ 微专注练习</h3><p class="subtle">只做5分钟，不追求完美。如果需要，可以随时停止。</p><div class="timer" id="focus-display">${formatSeconds(state.focusSeconds)}</div><div class="controls" style="justify-content:center"><button class="primary" data-act="focus-play">${focusRunning?'正在计时…':'开始计时'}</button><button class="secondary" data-act="focus-stop">结束并返回</button></div></div>`}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='小步星球-我的数据-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.getElementById('nav').addEventListener('click',e=>{let el=e.target.closest('[data-page]');if(el)changePage(el.dataset.page)});document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;if(a==='go-coach')changePage('coach');if(a==='complete')complete(id);if(a==='remove'){const t=state.tasks.find(x=>x.id===id);if(t&&confirm(`删除「${t.title}」？`)){state.tasks=state.tasks.filter(x=>x.id!==id);log('task_removed',{title:t.title},id);render()}}if(a==='start'){const t=state.tasks.find(x=>x.id===id);log('started',{title:t?.title,source:'button'},id);coaching('start',true)}if(a==='stuck'){const t=state.tasks.find(x=>x.id===id);log('obstacle',{title:t?.title,source:'button'},id);coaching('hard',true)}if(a==='recover')coaching('recover');if(a==='coach-quick')coaching(b.dataset.kind);if(a==='focus'){showFocus()}if(a==='focus-play'){setFocus();showFocus()}if(a==='focus-stop'){clearInterval(interval);interval=null;focusRunning=false;state.focusSeconds=300;log('focus_stopped');render()}if(a==='review'){const e=state.events.filter(x=>Date.now()-new Date(x.at).getTime()<=7*86400000);addYou('帮我做本周简短复盘');addAi(`最近7天记录到：完成任务${e.filter(x=>x.type==='completed').length}次、启动${e.filter(x=>x.type==='started').length}次、偏航恢复${e.filter(x=>x.type==='recovered').length}次。我们还不能判断未完成的原因。你觉得哪一种启动方法最有效？下周先保留它。`);changePage('coach')}if(a==='save-settings'){state.name=document.getElementById('nickname').value.trim()||'冒险家';Object.assign(state.settings,{style:document.getElementById('style').value,follow:Number(document.getElementById('follow').value),max:Number(document.getElementById('maxfollow').value),remind:document.getElementById('remind').checked,quiet:document.getElementById('quiet').checked,quietStart:document.getElementById('quietStart').value,quietEnd:document.getElementById('quietEnd').value});save();showToast('设置已保存');render()}if(a==='notification'){if(!('Notification'in window))showToast('此浏览器不支持通知API');else if(!window.isSecureContext)showToast('通知需在HTTPS或localhost安全环境使用');else{let p=await Notification.requestPermission();showToast('通知权限：'+p)}}if(a==='export')exportData();if(a==='reset'){if(confirm('这会清除当前浏览器保存的所有小步星球记录，确定吗？')){localStorage.removeItem(KEY);state=defaults();save();changePage('home');showToast('本地记录已重置')}}});document.addEventListener('submit',e=>{if(e.target.id==='addtask'){e.preventDefault();let title=document.getElementById('taskname').value.trim(),when=document.getElementById('tasktime').value,minutes=Number(document.getElementById('taskmins').value);if(!title)return;const t={id:newId(),title,when,minutes,done:false};state.tasks.push(t);log('task_created',{title,when},t.id);render();showToast('已加入今日计划')}if(e.target.id==='chat-form'){e.preventDefault();const el=document.getElementById('chat-input'),v=el.value.trim();if(v)replyFree(v)}});render();setInterval(checkReminders,15000);checkReminders()})();
</script></body></html>
